<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NET Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600&family=Vazirmatn:wght@400;500;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
:root {
  --bg: #1B1A1C;
  --bg2: #242326;
  --surface: #2B2A2D;
  --surface2: #353336;
  --fg: #F4EDE0;
  --muted: #B6B0A8;
  --line: rgba(244, 237, 224, .15);
  --accent: #F28C28;
  --accent-ink: #1B0F02;
  --glow: rgba(242, 140, 40, .16);
  --glow2: rgba(200, 64, 42, .22);
  --pat: rgba(242, 140, 40, .13);
  --glass: rgba(255, 255, 255, .05);
  --shadow: 0 18px 40px -18px rgba(0, 0, 0, .65);

  --en-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --en-body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ar-display: "Noto Kufi Arabic", "Vazirmatn", Tahoma, sans-serif;
  --ar-body: "Vazirmatn", "Noto Naskh Arabic", Tahoma, sans-serif;

  --hdr: 3.75rem;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F4F1EC; --bg2: #EAE5DD; --surface: #FFFFFF; --surface2: #EFEAE2;
    --fg: #2A2A2C; --muted: #5E5A55; --line: rgba(42, 42, 44, .16);
    --accent: #A44A06; --accent-ink: #FFFFFF;
    --glow: rgba(242, 140, 40, .26); --glow2: rgba(200, 64, 42, .12);
    --pat: rgba(42, 42, 44, .09); --glass: rgba(255, 255, 255, .72);
    --shadow: 0 18px 40px -20px rgba(42, 42, 44, .30);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F4F1EC; --bg2: #EAE5DD; --surface: #FFFFFF; --surface2: #EFEAE2;
  --fg: #2A2A2C; --muted: #5E5A55; --line: rgba(42, 42, 44, .16);
  --accent: #A44A06; --accent-ink: #FFFFFF;
  --glow: rgba(242, 140, 40, .26); --glow2: rgba(200, 64, 42, .12);
  --pat: rgba(42, 42, 44, .09); --glass: rgba(255, 255, 255, .72);
  --shadow: 0 18px 40px -20px rgba(42, 42, 44, .30);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-size: 16px; line-height: 1.55; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 90; background: var(--bg);
}
html.lock, html.lock body { overflow: hidden; }
button { font: inherit; color: inherit; }
h1, h2, h3, p, ul, figure { margin: 0; padding: 0; }
ul { list-style: none; }
svg { display: block; }
[hidden] { display: none !important; }

[lang="en"] { --f-display: var(--en-display); --f-body: var(--en-body); font-family: var(--f-body); }
[lang="ckb"], [lang="ar"] { --f-display: var(--ar-display); --f-body: var(--ar-body); font-family: var(--f-body); line-height: 1.75; }
.display { font-family: var(--f-display); font-weight: 600; text-wrap: balance; }
[lang="ckb"] .display, [lang="ar"] .display { font-weight: 700; }

.wrap {
  max-width: 52rem; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap.wide { max-width: 70rem; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.screen:not([hidden]) { animation: enter .4s ease both; }
@keyframes enter { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .screen:not([hidden]), .splash *, .splash-logo::before, .splash-logo::after, .lb { animation: none !important; }
  * { scroll-behavior: auto !important; transition: none !important; }
}

.pattern { position: absolute; inset: 0; z-index: -1; color: var(--pat); pointer-events: none;
  -webkit-mask-image: radial-gradient(ellipse 70% 80% at 75% 20%, #000, transparent 75%);
          mask-image: radial-gradient(ellipse 70% 80% at 75% 20%, #000, transparent 75%); }
.pattern svg { width: 100%; height: 100%; }

.flag { display: block; width: var(--fs, 72px); height: var(--fs, 72px); border-radius: 50%; overflow: hidden; flex: none;
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
.flag svg { width: 100%; height: 100%; }

/* ---------- NET logo ---------- */
.net { display: block; flex: none; width: var(--ls, 120px); height: var(--ls, 120px); border-radius: 50%;
  background: var(--logo) center / cover no-repeat; }
.net-xl { --ls: clamp(200px, 62vw, 300px);
  box-shadow: 0 0 0 5px var(--bg), 0 0 0 7px var(--accent), 0 30px 70px -20px rgba(0, 0, 0, .6), 0 0 110px -10px var(--glow); }
.net-s { --ls: 42px; box-shadow: 0 0 0 2px var(--accent); }
.net-mark { position: absolute; z-index: -1; --ls: 108px; top: 1.75rem;
  inset-inline-end: max(16px, env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
  box-shadow: 0 0 0 4px var(--bg2), 0 0 0 6px var(--accent), 0 18px 40px -16px rgba(0, 0, 0, .55); }
.hero h1, .hero .tag { padding-inline-end: 7.75rem; }
@media (min-width: 820px) {
  .net-mark { --ls: 260px; top: 50%; transform: translateY(-50%); inset-inline-end: max(16px, calc((100% - 70rem) / 2 + 16px));
    box-shadow: 0 0 0 5px var(--bg2), 0 0 0 7px var(--accent), 0 24px 60px -20px rgba(0, 0, 0, .55); }
  .hero h1, .hero .tag { padding-inline-end: 0; }
}

/* ---------- language opener ---------- */
.stage { position: relative; isolation: isolate; overflow: hidden;
  background:
    radial-gradient(900px 520px at 90% -10%, var(--glow), transparent 62%),
    radial-gradient(760px 520px at -5% 105%, var(--glow2), transparent 60%),
    var(--bg); }
.pk { display: grid; gap: 2rem; align-items: center; padding-block: clamp(1.75rem, 6vw, 4rem); }
.pk-brand { display: flex; justify-content: center; padding: 7px; }
.pk-hero { text-align: center; }
.alts { justify-content: center; }
.pk-side { display: grid; min-width: 0; }
@media (min-width: 820px) { .pk { grid-template-columns: 5fr 6fr; gap: 4rem; min-height: 72vh; } .net-xl { --ls: clamp(260px, 34vw, 400px); } .pk-hero { text-align: start; } .alts { justify-content: flex-start; } }
.eyebrow { font-size: .85rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.pk-hero h1 { margin-top: .6rem; font-size: clamp(2.5rem, 6.5vw, 4.25rem); line-height: 1; font-weight: 600; }
.alts { display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; margin-top: 1.1rem; font-size: 1.15rem; color: var(--muted); }
.langs { display: grid; gap: .9rem; margin-top: 1.75rem; }
.lang {
  --fs: 64px;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1.1rem;
  width: 100%; padding: 1rem 1.25rem; text-align: start; cursor: pointer;
  background: var(--glass); border: 1px solid var(--line); border-radius: 20px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  transition: transform .25s, border-color .25s, background .25s, box-shadow .25s;
}
.lang:hover { transform: translateY(-4px); border-color: var(--accent); background: var(--surface); box-shadow: var(--shadow); }
.lang-name { display: block; font-size: 1.9rem; line-height: 1.3; font-family: var(--f-display); font-weight: 700; }
[lang="en"].lang .lang-name { font-size: 2.1rem; }
.lang-sub { display: block; font-size: .85rem; color: var(--muted); font-family: var(--en-body); line-height: 1.4; }
.go { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--accent); color: var(--accent-ink); transition: transform .25s; }
.lang:hover .go { transform: translateX(4px); }

/* ---------- menu ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; justify-content: space-between; gap: 1rem; height: var(--hdr); }
.brand { display: inline-flex; align-items: center; gap: .55rem; font-size: 1.9rem; line-height: 1; }
.brand svg { color: var(--accent); }
.change {
  --fs: 26px; display: inline-flex; align-items: center; gap: .6rem; min-height: 2.6rem; padding: .25rem .95rem .25rem .35rem;
  background: var(--glass); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: .95rem; line-height: 1.2;
}
.change:hover { border-color: var(--accent); }
.change .flag { box-shadow: none; }

.hero { position: relative; isolation: isolate; overflow: hidden; border-bottom: 1px solid var(--line);
  background: radial-gradient(700px 360px at 85% 0%, var(--glow), transparent 65%), var(--bg2); }
.hero-in { padding-block: 2.25rem 2rem; }
.hero h1 { font-size: clamp(2.4rem, 9vw, 5rem); line-height: 1.1; }
.hero .tag { margin-top: .5rem; color: var(--muted); font-size: 1.1rem; }
.thanks { display: flex; align-items: center; gap: 1rem; margin-top: 1.5rem; padding: 1rem 1.25rem; max-width: 32rem;
  background: var(--glass); border: 1px solid var(--line); border-radius: 18px; }
.heart { display: grid; place-items: center; flex: none; width: 3rem; height: 3rem; border-radius: 50%; background: var(--accent); color: var(--accent-ink); }
.thanks b { display: block; font-weight: 600; font-size: 1.05rem; line-height: 1.4; }
.thanks span { color: var(--muted); font-size: .92rem; }

.cats { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr)); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.cats-in { display: flex; gap: .5rem; padding-block: .65rem; overflow-x: auto; scrollbar-width: none; }
.cats-in::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: .4rem 1.05rem; cursor: pointer; font-size: .95rem; line-height: 1.5; white-space: nowrap;
  background: transparent; border: 1px solid var(--line); border-radius: 999px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.sec { padding-top: 2.5rem; scroll-margin-top: calc(var(--hdr) + 3.6rem + env(safe-area-inset-top, 0px)); }
.sec-head { display: flex; align-items: center; gap: 1rem; }
.sec-head h2 { font-size: 2.4rem; line-height: 1.15; }
.sec-head i { flex: 1; height: 1px; background: var(--line); }
.grid { display: grid; gap: .75rem; margin-top: 1.25rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .grid { gap: 1.25rem; } }
@media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.card { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; transition: transform .25s, box-shadow .25s, border-color .25s; }
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent); }
.pic { position: relative; display: block; aspect-ratio: 4 / 3; padding: 0; border: 0; cursor: zoom-in; background: var(--surface2); overflow: hidden; }
.pic svg.art { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .5s; }
.card:hover .pic svg.art { transform: scale(1.06); }
.zoom { position: absolute; inset-block-end: .5rem; inset-inline-end: .5rem; display: grid; place-items: center; width: 1.9rem; height: 1.9rem;
  border-radius: 50%; background: rgba(6, 20, 22, .62); color: #fff; }
.info { display: flex; flex-direction: column; gap: .2rem; padding: .7rem .8rem .85rem; min-width: 0; }
.info h3 { font-size: 1rem; font-weight: 600; line-height: 1.4; }
.desc { color: var(--muted); font-size: .82rem; line-height: 1.55; }
[lang="ckb"] .desc, [lang="ar"] .desc { line-height: 1.8; }
.price { margin-top: auto; padding-top: .35rem; font-weight: 600; font-size: 1.05rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.price small { font-size: .78rem; font-weight: 500; color: var(--muted); }
.fav { align-self: flex-start; display: inline-flex; align-items: center; gap: .3rem; padding: 0 .6rem; margin-bottom: .15rem;
  font-size: .72rem; font-weight: 600; line-height: 1.8; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
@media (min-width: 640px) {
  .info { padding: .9rem 1rem 1rem; }
  .info h3 { font-size: 1.12rem; }
  .desc { font-size: .9rem; }
}

.foot { position: relative; isolation: isolate; overflow: hidden; margin-top: 3.5rem; border-top: 1px solid var(--line); background: var(--bg2); }
.foot-in { display: flex; align-items: center; gap: 1rem; padding-block: 2rem 2.5rem; }
.foot .net { --ls: 56px; box-shadow: 0 0 0 2px var(--accent); }
.foot p { color: var(--muted); font-size: .92rem; }
.foot p b { display: block; color: var(--fg); font-size: 1.1rem; font-weight: 600; }

/* ---------- thank-you splash ---------- */
.splash { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 2rem 1.25rem; text-align: center; isolation: isolate; overflow: hidden;
  background: radial-gradient(640px 420px at 50% 35%, var(--glow), transparent 70%), var(--bg); transition: opacity .45s; }
.splash { cursor: pointer; }
.splash.out { opacity: 0; pointer-events: none; }
.splash-in { display: grid; justify-items: center; gap: 1rem; max-width: 30rem; }
.splash-logo { position: relative; width: 11rem; height: 11rem; }
.splash-logo::before, .splash-logo::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: ring 1.8s ease-out infinite; }
.splash-logo::after { animation-delay: .9s; }
.net-splash { --ls: 11rem; position: relative; z-index: 1; box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--accent), 0 0 90px -10px var(--glow); }
.heart.badge { position: absolute; z-index: 2; inset-inline-end: -.4rem; inset-block-end: -.4rem; width: 3.4rem; height: 3.4rem; box-shadow: 0 0 0 4px var(--bg); animation: beat 1.6s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.9); opacity: 0; } }
.splash h2 { font-size: clamp(2.2rem, 8vw, 3.4rem); line-height: 1.15; margin-top: .5rem; }
.splash p { color: var(--muted); font-size: 1.1rem; }
.go-btn { margin-top: 1rem; padding: .7rem 1.6rem; border: 0; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 1rem;
  background: var(--accent); color: var(--accent-ink); }
.go-btn:hover { filter: brightness(1.08); }

/* ---------- photo lightbox ---------- */
.lb { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; overflow-y: auto;
  padding-block: calc(1rem + env(safe-area-inset-top, 0px)) 1rem;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: rgba(3, 12, 13, .86); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: enter .25s ease both; }
.lb-card { position: relative; width: min(46rem, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7); }
.lb-art { position: relative; aspect-ratio: 4 / 3; background: var(--surface2); }
.lb-art svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.lb-cap { padding: 1.1rem 1.4rem 1.4rem; display: grid; gap: .25rem; }
.lb-cap h3 { font-size: 1.7rem; line-height: 1.25; }
.lb-cap p { color: var(--muted); }
.lb-cap .price { font-size: 1.3rem; margin-top: .25rem; }
.lb-btn { position: absolute; display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border: 0; border-radius: 50%; cursor: pointer;
  background: rgba(6, 20, 22, .68); color: #fff; }
.lb-btn:hover { background: rgba(6, 20, 22, .9); }
.lb-close { inset-block-start: .75rem; inset-inline-end: .75rem; }
.lb-prev, .lb-next { top: 50%; margin-top: -1.375rem; }
.lb-prev { inset-inline-start: .75rem; }
.lb-next { inset-inline-end: .75rem; }
[dir="rtl"] .lb-prev svg, [dir="rtl"] .lb-next svg { transform: scaleX(-1); }
.lb-pic { position: absolute; inset: 0; }
.pic img.art, .lb-art img.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
</style>

  --fg: #2A2220; --muted: #6A5C52; --line: rgba(42, 34, 32, .22);

.stage { padding-block: clamp(26px, 5vw, 38px); }
.stage::before, .stage::after, .splash::before, .splash::after, .foot::before, .hero::after {
  content: ""; position: absolute; left: 0; right: 0; height: clamp(26px, 5vw, 38px); z-index: 1; pointer-events: none;
  background: var(--kilim) 0 0 / auto 100% repeat-x; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.stage::before, .splash::before { top: 0; }
.stage::after, .splash::after { bottom: 0; }
.foot::before { top: 0; }
.hero::after { bottom: 0; }
.hero-in { padding-block: clamp(1.25rem, 4vw, 2.25rem) calc(clamp(1.25rem, 4vw, 2rem) + clamp(26px, 5vw, 38px)); }
.foot-in { padding-top: calc(2rem + clamp(26px, 5vw, 38px)); }

:root { --hdr: calc(3.75rem + 18px); }
.bar { border-bottom: 0; padding-bottom: 18px; }
.bar-in { height: 3.75rem; }
.bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18px;
  background: linear-gradient(180deg, #D63A2B 0 33.34%, #FFFFFF 33.34% 66.67%, #2E9E64 66.67% 100%); }
.bar-sun { position: absolute; z-index: 2; left: 50%; bottom: -9px; width: 36px; height: 36px; margin-left: -18px; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35)); }
.bar-sun svg { width: 100%; height: 100%; }

.pk { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(.9rem, 4.5vw, 4rem); min-height: 0; }
.net-xl { --ls: clamp(112px, 33vw, 400px); }
.pk-brand { justify-content: center; }
.pk-hero { text-align: start; }

      void bag.offsetWidth;
      bag.classList.add("bump");
    }
  }
  function renderCart() {
    var c = CART_TXT[cur], total = 0, n = 0, rows = "";
    Object.keys(cart).forEach(function (key) { if (!ALL.some(function (a) { return a.key === key; })) delete cart[key]; });
    content.querySelectorAll(".qty").forEach(function (el) { el.innerHTML = qtyHtml(+el.getAttribute("data-k")); });
    if (!lb.hidden) $("lb-qty").innerHTML = qtyHtml(idx);
    ALL.forEach(function (a, k) {
      var q = cart[a.key];
      if (!q) return;
      total += a.it.p * q;
      n += q;
      rows += '<li class="srow">' + (foodImagePath(a.it.img) ? '<span class="sthumb">' + pic(a.it) + '</span>' : '') + '<div class="sinfo"><b>' + a.it.n[cur] + "</b><span>" + money(a.it.p) + " &times; " + price(q, cur) + '</span></div>' +
        '<div class="sright"><span class="qty">' + qtyHtml(k) + '</span><b class="sline">' + money(a.it.p * q) + "</b></div></li>";
    });
    $("sheet-list").innerHTML = rows || '<li class="sempty">' + c.empty + "</li>";
    $("sheet-title").textContent = c.order;
    $("sheet-total-l").textContent = c.total;
    $("sheet-total").textContent = money(total);
    $("sheet-note").textContent = c.note;
    $("sheet-clear").textContent = c.clear;
    $("sheet-clear").hidden = n === 0;
    $("basket-label").textContent = c.view;
    $("basket-n").textContent = price(n, cur);
    $("basket-total").textContent = money(total);
    basket.hidden = n === 0;
    menu.classList.toggle("has-cart", n > 0);
    if (n === 0) closeSheet();
  }
  function openSheet() {
    if (!sheet.hidden) return;
    sheet.hidden = false;
    lockPage();
    $("sheet-x").focus({ preventScroll: true });
  }
  function closeSheet() {
    if (sheet.hidden) return;
    sheet.hidden = true;
    unlockPage();
    if (!basket.hidden) { try { basket.focus({ preventScroll: true }); } catch (err) {} }
  }
  function onCartClick(e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var k = +b.getAttribute("data-k"), q = qtyOf(k);
    setQty(k, b.getAttribute("data-act") === "add" ? q + 1 : q - 1);
  }
  content.addEventListener("click", onCartClick);
  $("sheet-list").addEventListener("click", onCartClick);
  $("lb-qty").addEventListener("click", onCartClick);
  basket.addEventListener("click", openSheet);
  $("sheet-x").addEventListener("click", closeSheet);
  $("sheet-back").addEventListener("click", closeSheet);
  $("sheet-clear").addEventListener("click", function () { cart = {}; saveCart(); renderCart(); });
  loadCart();

  /* ---------- splash ---------- */
  function closeSplash() {
    clearTimeout(splashTimer);
    if (splash.hidden) return;
    splash.classList.add("out");
    unlockPage();
    setTimeout(function () { splash.hidden = true; splash.classList.remove("out"); }, reduce ? 0 : 450);
    var h = $("menu-title"); if (h) h.focus({ preventScroll: true });
  }
  function openSplash() {
    splash.hidden = false;
    splash.classList.remove("out");
    lockPage();
    splashTimer = setTimeout(closeSplash, 2000);
  }
  splash.addEventListener("click", closeSplash);

  /* ---------- lightbox ---------- */
  function showPhoto(i) {
    var t = UI[cur], it;
    idx = (i + ALL.length) % ALL.length;
    it = ALL[idx].it;
    lb.lang = TAG[cur];
    lb.dir = cur === "en" ? "ltr" : "rtl";
    $("lb-card").classList.toggle("no-food-photo", !foodImagePath(it.img));
    $("lb-pic").innerHTML = pic(it, true);
    $("lb-qty").setAttribute("data-k", idx);
    $("lb-qty").innerHTML = qtyHtml(idx);
    $("lb-name").textContent = it.n[cur];
    $("lb-desc").textContent = it.d[cur];
    $("lb-price").innerHTML = price(it.p, cur) + " <small>" + t.cur + "</small>";
    lb.setAttribute("aria-label", it.n[cur]);
  }
  function openPhoto(i, opener) {
    lastFocus = opener || null;
    showPhoto(i);
    lb.hidden = false;
    lockPage();
    $("lb-close").focus({ preventScroll: true });
  }
  function closePhoto() {
    if (lb.hidden) return;
    lb.hidden = true;
    unlockPage();
    if (lastFocus) { try { lastFocus.focus({ preventScroll: true }); } catch (err) {} }
  }
  content.addEventListener("click", function (e) {
    var b = e.target.closest(".open");
    if (b && !e.target.closest(".buy")) openPhoto(+b.getAttribute("data-open"), b);
  });
  content.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var b = e.target.closest(".open");
    if (b && e.target === b) { e.preventDefault(); openPhoto(+b.getAttribute("data-open"), b); }
  });
  $("lb-close").addEventListener("click", closePhoto);
  $("lb-prev").addEventListener("click", function () { showPhoto(idx - 1); });
  $("lb-next").addEventListener("click", function () { showPhoto(idx + 1); });
  lb.addEventListener("click", function (e) { if (e.target === lb) closePhoto(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (!sheet.hidden) closeSheet(); else if (!lb.hidden) closePhoto(); else if (!splash.hidden) closeSplash(); return; }
    if (lb.hidden) return;
    var rtl = menu.dir === "rtl";
    if (e.key === "ArrowRight") showPhoto(idx + (rtl ? -1 : 1));
    if (e.key === "ArrowLeft") showPhoto(idx + (rtl ? 1 : -1));
  });

  /* ---------- navigation ---------- */
  typeChips.addEventListener("click", function (e) {
    var b = e.target.closest("[data-group]");
    if (!b) return;
    var nextGroup = b.getAttribute("data-group");
    if (nextGroup !== activeGroup) {
      activeGroup = nextGroup;
      render(cur);
      measure();
      content.classList.remove("group-enter");
      void content.offsetWidth;
      content.classList.add("group-enter");
    }
    // Still one continuous, scrollable menu. New Food comes first on Food.
    // Scroll directly below the two navigation bars, not to a separate page.
    var desired = activeGroup === "food" ? $("featured") : $("choose-for-me");
    if (desired) {
      var navHeight = typesNav.offsetHeight + $("cats-nav").offsetHeight;
      var y = Math.max(0, desired.getBoundingClientRect().top + window.scrollY - navHeight - 8);
      window.scrollTo({top:y,behavior: reduce ? "auto" : "smooth"});
    }
  });
  content.addEventListener("click", function (e) {
    var suggest = e.target.closest("[data-suggest]");
    if (suggest) {
      var act = suggest.getAttribute("data-suggest");
      if (act === "details") { openPhoto(+suggest.getAttribute("data-k"), suggest); return; }
      showRandomSuggestion();
      return;
    }
    var jump = e.target.closest("[data-jump]");
    if (jump) goTo(jump.getAttribute("data-jump"));
  });
  chips.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    goTo(chip.getAttribute("data-target"));
  });

  picker.addEventListener("click", function (e) {
    var b = e.target.closest(".fs-lang");
    if (!b) return;
    activeGroup = "food";
    render(b.getAttribute("data-lang"));
    document.documentElement.classList.remove("nos");
    picker.hidden = true;
    menu.hidden = false;
    menu.classList.remove("nav-compact");
    window.scrollTo(0, 0);
    measure();
    onScroll();
    // Open directly onto the featured food area, without the welcome overlay.
  });

  $("change").addEventListener("click", function () {
    closePhoto();
    closeSheet();
    menu.hidden = true;
    document.documentElement.classList.add("nos");
    picker.hidden = false;
    window.scrollTo(0, 0);
    picker.querySelector(".fs-lang").focus({ preventScroll: true });
  });
})();
</script>

</body>
</html>
